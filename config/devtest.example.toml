[relay]
enabled = true
bot_id = "223123"
bot_name = "清风"
# DEV: localhost for tests.
# PRODUCTION, plaintext broker: relay_url = "mqtt://broker.example.com:1883"
# PRODUCTION, TLS broker: relay_url = "mqtts://broker.example.com:8883"
# mqtts:// automatically enables TLS and defaults to port 8883 when no port is set.
relay_url = "mqtt://localhost:1883"

# Shared group token. Leave empty for anonymous compatibility. If this bot sets
# a token, inbound relay messages must carry the same token or they are dropped
# before session, LLM, todo, and message storage processing.
auth_token = ""

# TLS can be enabled either by using mqtts:// in relay_url or by setting
# tls_enabled = true. Empty tls_ca_file uses the operating system trust store.
# Use tls_ca_file for a private/self-signed broker CA. tls_cert_file and
# tls_key_file are only needed when the broker requires client certificates.
tls_enabled = false
tls_ca_file = ""
tls_cert_file = ""
tls_key_file = ""

# Local diagnostics only. Do not use in production: this disables certificate
# chain validation and hostname verification.
tls_insecure = false

[partners.bot_b]
bot_id = "114514"
bot_name = "流光"

[presence]
allowed_partner_bots = ["114514"]
require_known_partner = true

# DEV/TEST ONLY:
# This file is only for plugin-local testing inside plugins/bot_private_relay.
# Production deployment: the framework automatically loads
#   config/plugins/bot_private_relay/config.toml
# via BaseConfig.get_default_path(). Edit that file for production settings.
